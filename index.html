<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Finances du couple</title>
<meta name="theme-color" content="#F5F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* ════════════════════════════════════════════════════════════════
     SEULE LIGNE À MODIFIER : colle entre les guillemets le lien de ton
     application web Apps Script (celui qui finit par /exec).
     ════════════════════════════════════════════════════════════════ */
  https://script.google.com/macros/s/AKfycby_h56nlSqCnj2MmdFAKHEFhXtAQ6G3OYGT6LNfaw-aIG_kSEVaSlJiVKd41VhHQmZyzQ/exec';
</script>
<style>
  :root { --bg:#F5F2EA; --ink:#15201C; --muted:#6B7771; --brand:#0E5E4E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0C1210; --ink:#ECF1EE; --muted:#93A19A; --brand:#3CC59E; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); }
  iframe { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; background:var(--bg); }
  #ecran { position:fixed; inset:0; z-index:2; display:grid; place-items:center; text-align:center; padding:24px; background:var(--bg); transition:opacity .45s ease, visibility .45s; }
  #ecran.parti { opacity:0; visibility:hidden; }
  .logo { width:84px; height:84px; border-radius:24px; margin:0 auto 18px; box-shadow:0 16px 34px -14px rgba(8,47,40,.7); animation:pulse 1.5s ease-in-out infinite; }
  h1 { font-size:20px; letter-spacing:-.02em; margin-bottom:14px; }
  .barre { width:130px; height:4px; border-radius:9px; background:rgba(127,127,127,.18); overflow:hidden; margin:0 auto; }
  .barre::after { content:''; display:block; width:40%; height:100%; border-radius:inherit; background:var(--brand); animation:charge 1.1s ease-in-out infinite; }
  #msg { margin-top:16px; font-size:14px; color:var(--muted); min-height:20px; max-width:300px; line-height:1.45; }
  button { margin-top:14px; font:inherit; font-weight:700; color:#fff; background:#0E5E4E; border:0; border-radius:14px; padding:12px 20px; cursor:pointer; display:none; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  @keyframes charge { from { transform:translateX(-100%); } to { transform:translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="ecran">
  <div>
    <img class="logo" src="icone-192.png" alt="">
    <h1>Finances du couple</h1>
    <div class="barre" id="barre"></div>
    <p id="msg"></p>
    <button id="reessayer" onclick="location.reload()">Réessayer</button>
  </div>
</div>
<script>
  const ecran = document.getElementById('ecran'), msg = document.getElementById('msg');
  const barre = document.getElementById('barre'), bouton = document.getElementById('reessayer');
  const probleme = (texte) => { msg.textContent = texte; barre.style.display = 'none'; bouton.style.display = 'inline-block'; };

  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(LIEN_APPLI)) {
    probleme("Il manque le lien de l'application : ouvre index.html et colle-le à la ligne LIEN_APPLI.");
    bouton.style.display = 'none';
  } else if (!navigator.onLine) {
    probleme('Pas de connexion internet. Vérifie ta connexion puis réessaie.');
  } else {
    const f = document.createElement('iframe');
    f.src = LIEN_APPLI;
    f.title = 'Finances du couple';
    f.allow = 'clipboard-write';
    f.addEventListener('load', () => setTimeout(() => ecran.classList.add('parti'), 600));
    document.body.appendChild(f);
    setTimeout(() => { if (!ecran.classList.contains('parti')) msg.textContent = 'La connexion est lente, encore un instant…'; }, 12000);
    setTimeout(() => { if (!ecran.classList.contains('parti')) probleme("L'application ne répond pas. Vérifie ta connexion puis réessaie."); }, 45000);
  }
  window.addEventListener('offline', () => { if (ecran.classList.contains('parti')) { ecran.classList.remove('parti'); probleme('Connexion internet perdue.'); } });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
